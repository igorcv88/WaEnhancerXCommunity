name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v6
      - name: Validate release-note generator
        run: python3 -m py_compile .github/scripts/build_release_notes.py
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testWhatsappDebugUnitTest :app:assembleWhatsappDebug
