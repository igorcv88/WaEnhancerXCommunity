name: Temporary Codex review fix transform

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply selected review fixes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/run-review-fix || ! -f tools/review_fix_transform.py ]]; then
            echo "No review-fix request; skipping."
            exit 0
          fi

          python3 tools/review_fix_transform.py
          rm -f .github/run-review-fix tools/review_fix_transform.py

          git config user.name "ChatGPT Review Fixes"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: address actionable Codex review findings"
          git fetch origin "${HEAD_REF}"
          git rebase "origin/${HEAD_REF}"
          git push origin "HEAD:${HEAD_REF}"
