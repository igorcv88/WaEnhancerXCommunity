name: Temporary Codex review fix audit

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preference XML no longer references removed Pro classes
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'com\.waenhancer\.preference\.Pro(PreferenceCategory|SwitchPreference)' app/src/main/res/xml; then
            echo "Preference XML still references removed Pro preference classes." >&2
            exit 1
          fi
      - name: Verify Community URLs and package targets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'https?://[^"[:space:]]*WaEnhancer[[:space:]]+Community|https://t\.me/WaEnhancer[[:space:]]+Community' app/src/main; then
            echo "Malformed rebrand URL remains." >&2
            exit 1
          fi
          patterns='getLaunchIntentForPackage\("com\.waenhancer"|createPackageContext\("com\.waenhancer"|ComponentName\("com\.waenhancer"|setPackage\("com\.waenhancer"'
          if grep -RInE "$patterns" app/src/main/java; then
            echo "Explicit runtime package target still uses the pre-rebrand application ID." >&2
            exit 1
          fi
          grep -q 'https://github.com/igorcv88/WaEnhancerX' app/src/main/java/com/waenhancer/ui/fragments/HomeFragment.java
          grep -q 'https://t.me/WaEnhancerX' app/src/main/java/com/waenhancer/ui/fragments/HomeFragment.java
      - name: Verify inactive-theme and switch-flow safeguards
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/waenhancer/activities/TextEditorActivity.java'
          grep -q 'preferenceKey' "$file"
          grep -q 'activeTheme' "$file"
          grep -q 'CssSafetyManager.validate(content)' "$file"
          grep -q 'case R.id.menuitem_save ->' "$file"
          grep -q 'case R.id.menuitem_test_theme ->' "$file"
          if sed -n '/onOptionsItemSelected/,/private void notifyCssChanged/p' "$file" | grep -qE 'case R\.id\.[A-Za-z0-9_]+[[:space:]]*:'; then
            echo "Menu switch still contains fall-through style case labels." >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build debug and release and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean \
            assembleWhatsappDebug \
            assembleWhatsappRelease \
            testWhatsappDebugUnitTest

  signed-release:
    needs: [invariants, build]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and verify signed release
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Required secret $name is missing." >&2; exit 1; }
          done

          KEYSTORE_PATH="$RUNNER_TEMP/waenhancer-community-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          chmod +x gradlew

          ./gradlew --no-daemon clean assembleWhatsappRelease \
            -PandroidStoreFile="$KEYSTORE_PATH" \
            -PandroidStorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"

          APK="$(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [[ -n "$APK" && -s "$APK" ]]
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ! grep -qi 'Android Debug' "$RUNNER_TEMP/apksigner.txt"
          APK_CERT="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEYSTORE_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$APK_CERT" && "$APK_CERT" == "$KEYSTORE_CERT" ]]

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          grep -q "name='com.waenhancer.community'" <<< "$BADGING"
          grep -q "versionCode='18001'" <<< "$BADGING"
          grep -q "versionName='1.8.0-alpha1'" <<< "$BADGING"
          sha256sum "$APK"
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/waenhancer-community-release.jks" "$RUNNER_TEMP/apksigner.txt"
