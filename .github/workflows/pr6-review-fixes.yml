name: PR6 review fixes

on:
  push:
    branches:
      - compat/runtime-host-probe

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/runtime-host-probe
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply reviewed compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found for {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          feature = 'app/src/main/java/com/waenhancer/xposed/core/Feature.java'
          replace_once(
              feature,
              '''    public Feature(@NonNull ClassLoader classLoader, @NonNull SharedPreferences preferences) {\n        // Version strings are not a compatibility test. Before any feature is allowed to install\n        // hooks, verify that the semantic DexKit anchors required by the module core still resolve\n        // against the APK that is actually running. The result is cached process-wide.\n        HostCompatibility.requireCoreCompatibility(classLoader);\n        this.classLoader = classLoader;\n        this.prefs = preferences;\n    }''',
              '''    public Feature(@NonNull ClassLoader classLoader, @NonNull SharedPreferences preferences) {\n        this.classLoader = classLoader;\n        this.prefs = preferences;\n    }''',
              'remove late Feature-constructor probe'
          )

          loader = 'app/src/main/java/com/waenhancer/xposed/core/FeatureLoader.java'
          old_gate = '''                            if (!isSupported) {\n                                disableExpirationVersion(mApp.getClassLoader());\n                                if (pref.getBoolean("bypass_version_check", false)) {\n                                    // User opted in: load all features despite unsupported version\n                                    load(loader, pref, packageInfo, sourceDir);\n                                } else {\n                                    String sb = "Unsupported version: " +\n                                            packageInfo.versionName +\n                                            "\\n" +\n                                            "Only the function of ignoring the expiration of the WhatsApp version has been applied!";\n                                    throw new Exception(sb);\n                                }\n                            } else {\n                                // Version is supported — load normally\n                                load(loader, pref, packageInfo, sourceDir);\n                            }'''
          new_gate = '''                            boolean runtimeProbeEligible = isRuntimeProbeEligible(packageInfo.versionName);\n                            boolean bypassVersionCheck = pref.getBoolean("bypass_version_check", false);\n\n                            if (!isSupported && !runtimeProbeEligible && !bypassVersionCheck) {\n                                disableExpirationVersion(mApp.getClassLoader());\n                                String sb = "Unsupported version: " +\n                                        packageInfo.versionName +\n                                        "\\n" +\n                                        "Only the function of ignoring the expiration of the WhatsApp version has been applied!";\n                                throw new Exception(sb);\n                            }\n\n                            // Version allowlists are validated-build metadata, not compatibility proof.\n                            // For known builds, newer WhatsApp 2.x hosts, or an explicit version-check\n                            // bypass, prove the required semantic contracts against the installed APK\n                            // before initComponents() can install any core hooks.\n                            HostCompatibility.requireCoreCompatibility(loader);\n\n                            if (!isSupported) {\n                                disableExpirationVersion(mApp.getClassLoader());\n                                XposedBridge.log("[WAEX] Version " + packageInfo.versionName\n                                        + " is not in the validated-version list; proceeding after runtime compatibility probe");\n                            }\n                            load(loader, pref, packageInfo, sourceDir);'''
          replace_once(loader, old_gate, new_gate, 'separate runtime probing from validated-version allowlist')

          marker = '''    public static void disableExpirationVersion(ClassLoader classLoader) throws Exception {'''
          helper = '''    /**\n     * Select hosts that may be evaluated by the semantic compatibility probe.\n     * This is deliberately separate from supported_versions_*: those arrays remain\n     * the companion UI's list of builds that have actually been regression-tested.\n     */\n    private static boolean isRuntimeProbeEligible(String versionName) {\n        return versionName != null && versionName.startsWith("2.");\n    }\n\n'''
          replace_once(loader, marker, helper + marker, 'add broad runtime-probe eligibility')

          fmessage = Path('app/src/main/java/com/waenhancer/xposed/core/components/FMessageWpp.java')
          text = fmessage.read_text()
          start = text.index('    public static void initialize(ClassLoader classLoader) {')
          end = text.index('    public static boolean checkUnsafeIsFMessage', start)
          new_initialize = '''    public static void initialize(ClassLoader classLoader) {\n        // Required FMessage contracts are initialized together. HostCompatibility has already\n        // resolved the core anchors before FeatureLoader reaches initComponents(), so failure\n        // here is a concrete initialization error rather than a version-string decision.\n        try {\n            TYPE = Unobfuscator.loadFMessageClass(classLoader);\n            UserJid.TYPE_USERJID = Unobfuscator.findFirstClassUsingName(classLoader, StringMatchType.EndsWith, "jid.UserJid");\n            UserJid.TYPE_JID = Unobfuscator.findFirstClassUsingName(classLoader, StringMatchType.EndsWith, "jid.Jid");\n            UserJid.TYPE_PHONEUSERJID = Unobfuscator.findFirstClassUsingName(classLoader, StringMatchType.EndsWith, "jid.PhoneUserJid");\n            UserJid.TYPE_DEVICEJID = Unobfuscator.findFirstClassUsingName(classLoader, StringMatchType.EndsWith, "jid.DeviceJid");\n            var userJidClass = UserJid.TYPE_USERJID;\n            userJidMethod = ReflectionUtils.findMethodUsingFilter(TYPE,\n                    method -> method.getParameterCount() == 0 && method.getReturnType() == userJidClass);\n            keyMessage = Unobfuscator.loadMessageKeyField(classLoader);\n            Key.TYPE = keyMessage.getType();\n            messageMethod = Unobfuscator.loadNewMessageMethod(classLoader);\n            deviceJidField = ReflectionUtils.findFieldUsingFilter(TYPE, field -> field.getType() == UserJid.TYPE_DEVICEJID);\n\n            if (Key.TYPE != null) {\n                keyIdField = ReflectionUtils.getFieldByType(Key.TYPE, String.class);\n                keyFromMeField = ReflectionUtils.getFieldByType(Key.TYPE, boolean.class);\n                keyRemoteJidField = ReflectionUtils.getFieldByExtendType(Key.TYPE, UserJid.TYPE_JID);\n            }\n        } catch (Throwable t) {\n            XposedBridge.log("[WAEX] Required FMessage initialization failed: " + t);\n            return;\n        }\n\n        // Optional capabilities must be independent. A missing media resolver, for example, must\n        // not prevent broadcast/edit/status-related fields from being initialized later in this\n        // method. Each dependent feature can then fail/report on its own resolver instead of\n        // inheriting unrelated null state from an earlier optional miss.\n        try {\n            messageWithMediaMethod = Unobfuscator.loadNewMessageWithMediaMethod(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("messageWithMediaMethod", t);\n        }\n        try {\n            mediaTypeField = Unobfuscator.loadMediaTypeField(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("mediaTypeField", t);\n        }\n        try {\n            getOriginalMessageKey = Unobfuscator.loadOriginalMessageKey(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("getOriginalMessageKey", t);\n        }\n        try {\n            abstractMediaMessageClass = Unobfuscator.loadAbstractMediaMessageClass(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("abstractMediaMessageClass", t);\n        }\n        try {\n            broadcastField = Unobfuscator.loadBroadcastTagField(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("broadcastField", t);\n        }\n        try {\n            getFieldIdMessage = Unobfuscator.loadSetEditMessageField(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("getFieldIdMessage", t);\n        }\n        try {\n            timestampField = Unobfuscator.loadFmessageTimestampField(classLoader);\n        } catch (Throwable t) {\n            logOptionalResolverFailure("timestampField", t);\n        }\n    }\n\n    private static void logOptionalResolverFailure(String resolver, Throwable throwable) {\n        XposedBridge.log("[WAEX] Optional FMessage resolver unavailable: " + resolver + ": " + throwable);\n    }\n\n'''
          fmessage.write_text(text[:start] + new_initialize + text[end:])

          overlay = Path('app/src/main/res/values-v28/host_compatibility.xml')
          if not overlay.exists():
              raise SystemExit('Expected values-v28/host_compatibility.xml to exist')
          overlay.unlink()

          # This workflow is a one-shot patch vehicle. Remove it from the resulting branch commit.
          Path('.github/workflows/pr6-review-fixes.yml').unlink()
          PY

      - name: Verify review fixes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'HostCompatibility.requireCoreCompatibility(classLoader)' app/src/main/java/com/waenhancer/xposed/core/Feature.java
          grep -q 'HostCompatibility.requireCoreCompatibility(loader)' app/src/main/java/com/waenhancer/xposed/core/FeatureLoader.java
          grep -q 'isRuntimeProbeEligible' app/src/main/java/com/waenhancer/xposed/core/FeatureLoader.java
          test ! -e app/src/main/res/values-v28/host_compatibility.xml
          grep -q 'Optional FMessage resolver unavailable' app/src/main/java/com/waenhancer/xposed/core/components/FMessageWpp.java

      - name: Test and build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testWhatsappDebugUnitTest :app:assembleWhatsappDebug

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address runtime compatibility review findings'
          git push origin HEAD:compat/runtime-host-probe
