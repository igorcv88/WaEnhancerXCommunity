name: Temporary Block A and B final audit

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject prohibited closed-system references
        shell: bash
        run: |
          set -euo pipefail
          pattern='com\.waex\.helper|ProHelper|LicenseManager|LicenseActivity|ProFeaturesActivity|PillDesignPro|libpro_native\.so|appendDexPath|FirebaseAnalytics|FirebaseCrashlytics|google-services|firebase_'
          if grep -RInE "$pattern" app api build.gradle.kts gradle 2>/dev/null; then
            echo "Prohibited Helper/Pro/Firebase reference remains." >&2
            exit 1
          fi

      - name: Reject embedded private keys and certificates
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE' app api 2>/dev/null; then
            echo "Embedded private key or certificate remains in source." >&2
            exit 1
          fi

      - name: Reject unsafe configuration backup implementation
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/waenhancer/ui/fragments/HomeFragment.java'
          backup_methods="$(sed -n '/private void saveConfigs/,/private boolean isInitialCheck/p' "$file")"
          if grep -nE 'getAll\(\)|edit\(\)\.clear\(\)|\.clear\(\)\.commit\(\)' <<< "$backup_methods"; then
            echo "Backup export/import still contains a raw preference dump or destructive clear." >&2
            exit 1
          fi
          grep -q 'BackupCodec.exportSettings' <<< "$backup_methods"
          grep -q 'BackupCodec.parseAndValidate' <<< "$backup_methods"
          grep -q 'BackupCodec.apply' <<< "$backup_methods"

      - name: Verify manual-only release workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/android.yml'
          on_block="$(awk '/^on:/{active=1; next} active && /^[^ ]/{exit} active{print}' "$workflow")"
          grep -q '^  workflow_dispatch:' <<< "$on_block"
          if grep -qE '^  (push|pull_request|schedule|release):' <<< "$on_block"; then
            echo "Release workflow has an automatic trigger." >&2
            exit 1
          fi
          if grep -q 'actions/upload-artifact' "$workflow"; then
            echo "Release workflow still uploads Actions artifacts." >&2
            exit 1
          fi
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            grep -q "$secret" "$workflow"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile debug and release and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean \
            assembleWhatsappDebug \
            assembleWhatsappRelease \
            testWhatsappDebugUnitTest

  signed-release:
    needs: [inventory, build]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and verify signed release
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret $name is missing." >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/waenhancer-community-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          chmod +x gradlew

          ./gradlew --no-daemon clean assembleWhatsappRelease \
            -PandroidStoreFile="$KEYSTORE_PATH" \
            -PandroidStorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"

          APK="$(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          [[ -n "$APK" && -s "$APK" ]] || { echo "Signed release APK not found." >&2; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          [[ -x "$APKSIGNER" && -x "$AAPT" ]] || { echo "Android verification tools unavailable." >&2; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -qi 'Android Debug' "$RUNNER_TEMP/apksigner.txt"; then
            echo "Release APK is signed with the Android debug certificate." >&2
            exit 1
          fi

          APK_CERT="$(sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer): certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEYSTORE_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$APK_CERT" && -n "$KEYSTORE_CERT" && "$APK_CERT" == "$KEYSTORE_CERT" ]] || {
            echo "APK signing certificate does not match the configured keystore alias." >&2
            exit 1
          }

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          grep -q "name='com.waenhancer.community'" <<< "$BADGING"
          grep -q "versionCode='18001'" <<< "$BADGING"
          grep -q "versionName='1.8.0-alpha1'" <<< "$BADGING"
          sha256sum "$APK"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/waenhancer-community-release.jks" \
                "$RUNNER_TEMP/apksigner.txt"
