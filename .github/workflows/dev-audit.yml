name: Temporary Block A and B audit

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply requested transformation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/run-next-transform || ! -f tools/next_transform.py ]]; then
            echo "No transformation marker; skipping."
            exit 0
          fi
          python3 tools/next_transform.py
          rm -f .github/run-next-transform tools/next_transform.py
          git config user.name "ChatGPT Blocks A-B"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete block-a and block-b integration"
          git push origin "HEAD:${HEAD_REF}"

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory prohibited references
        shell: bash
        run: |
          set -uo pipefail
          grep -RInE 'com\.waex\.helper|ProHelper|LicenseManager|LicenseActivity|ProFeaturesActivity|PillDesignPro|libpro_native\.so|appendDexPath|FirebaseAnalytics|FirebaseCrashlytics|google-services|firebase_' app api build.gradle.kts gradle 2>/dev/null || true
          echo '=== raw backup hazards ==='
          grep -RInE 'prefs\.getAll\(\).*JSONObject|prefs\.edit\(\)\.clear|clear_preferences' app/src/main/java 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile debug and run unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleWhatsappDebug testWhatsappDebugUnitTest
