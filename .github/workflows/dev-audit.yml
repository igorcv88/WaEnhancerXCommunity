name: Temporary Block A and B final audit

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject prohibited closed-system references
        shell: bash
        run: |
          set -euo pipefail
          pattern='com\.waex\.helper|ProHelper|LicenseManager|LicenseActivity|ProFeaturesActivity|PillDesignPro|libpro_native\.so|appendDexPath|FirebaseAnalytics|FirebaseCrashlytics|google-services|firebase_'
          if grep -RInE "$pattern" app api build.gradle.kts gradle 2>/dev/null; then
            echo "Prohibited Helper/Pro/Firebase reference remains." >&2
            exit 1
          fi

      - name: Reject embedded private keys and certificates
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE' app api 2>/dev/null; then
            echo "Embedded private key or certificate remains in source." >&2
            exit 1
          fi

      - name: Reject unsafe configuration backup implementation
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/waenhancer/ui/fragments/HomeFragment.java'
          backup_methods="$(sed -n '/private void saveConfigs/,/private boolean isInitialCheck/p' "$file")"
          if grep -nE 'getAll\(\)|edit\(\)\.clear\(\)|\.clear\(\)\.commit\(\)' <<< "$backup_methods"; then
            echo "Backup export/import still contains a raw preference dump or destructive clear." >&2
            exit 1
          fi
          grep -q 'BackupCodec.exportSettings' <<< "$backup_methods"
          grep -q 'BackupCodec.parseAndValidate' <<< "$backup_methods"
          grep -q 'BackupCodec.apply' <<< "$backup_methods"

      - name: Verify manual-only release workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/android.yml'
          grep -q 'workflow_dispatch:' "$workflow"
          if grep -qE '^  (push|pull_request|schedule|release):' "$workflow"; then
            echo "Release workflow has an automatic trigger." >&2
            exit 1
          fi
          if grep -q 'actions/upload-artifact' "$workflow"; then
            echo "Release workflow still uploads Actions artifacts." >&2
            exit 1
          fi
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            grep -q "$secret" "$workflow"
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile debug and release and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean \
            assembleWhatsappDebug \
            assembleWhatsappRelease \
            testWhatsappDebugUnitTest
