name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Run repository regression checks
        run: |
          python3 tools/test_app_only_runtime.py
          python3 tools/test_glass_probe.py
          python3 tools/test_conversation_glass.py
          python3 tools/test_composer_backing.py
          python3 tools/test_composer_finishing.py
      - name: Run local unit tests
        run: bash ./gradlew --no-daemon :app:testWhatsappDebugUnitTest
      - name: Run Android lint
        run: bash ./gradlew --no-daemon :app:lintWhatsappDebug
      - name: Compile unsigned debug APK
        run: bash ./gradlew --no-daemon :app:assembleWhatsappDebug
