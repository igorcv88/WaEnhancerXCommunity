name: Build Signed APK From Latest Open PR

on:
  workflow_dispatch:

# A preview must never tag or publish a GitHub Release. Unlike the official release
# job this token can only read the repository and its pull requests.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: waenhancer-signed-pr-preview
  cancel-in-progress: false

env:
  RELEASE_SERIES: "0.0"

jobs:
  preview:
    name: Resolve, test, sign and upload PR APK
    runs-on: ubuntu-latest

    steps:
      - name: Select latest open PR from this repository
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Start this workflow from master; the PR branch is selected automatically."
            exit 1
          fi

          # Resolve once, then check out the immutable SHA, not the mutable head branch.
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=created&direction=desc&per_page=1")"
          PR_NUMBER="$(jq -r '.[0].number // empty' <<< "$PR_JSON")"
          PR_SHA="$(jq -r '.[0].head.sha // empty' <<< "$PR_JSON")"
          PR_REPO="$(jq -r '.[0].head.repo.full_name // empty' <<< "$PR_JSON")"
          PR_AUTHOR="$(jq -r '.[0].user.login // empty' <<< "$PR_JSON")"
          PR_BASE="$(jq -r '.[0].base.ref // empty' <<< "$PR_JSON")"

          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::No open pull request was found. Keep the feature PR open to build its APK."
            exit 1
          }
          if [[ "$PR_REPO" != "$GITHUB_REPOSITORY" || "$PR_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" || "$PR_BASE" != "master" ]]; then
            echo "::error::The newest PR must target master, originate in this repository and be authored by its owner. Refusing to expose signing credentials to an untrusted branch."
            exit 1
          fi

          SHORT_SHA="${PR_SHA:0:8}"
          {
            echo "number=$PR_NUMBER"
            echo "head_sha=$PR_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Selected PR"
            echo "- PR: #${PR_NUMBER}"
            echo "- Commit: \`${PR_SHA}\`"
            echo "- Artifact only: no release or tag will be created"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out selected PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected PR is still open and unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<< "$CURRENT")" == "open" ]] || {
            echo "::error::PR #${PR_NUMBER} was closed while the build was starting."
            exit 1
          }
          [[ "$(jq -r '.head.sha' <<< "$CURRENT")" == "$EXPECTED_SHA" ]] || {
            echo "::error::PR #${PR_NUMBER} changed commits; restart to build the latest SHA."
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Run source and runtime checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_app_only_runtime.py
          python3 tools/test_glass_probe.py
          python3 tools/test_conversation_glass.py
          python3 tools/test_composer_backing.py
          python3 tools/test_composer_finishing.py

      - name: Choose an update-compatible preview version
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          BASE_CODE="$(sed -n 's/^VERSION_CODE=//p' gradle.properties | tr -d '\r' | tail -n 1)"
          [[ "$BASE_CODE" =~ ^[0-9]+$ ]] || {
            echo "::error::VERSION_CODE in gradle.properties must be numeric."
            exit 1
          }
          MAX_CODE="$BASE_CODE"
          MAX_PATCH=0
          SERIES_PATTERN="${RELEASE_SERIES//./\\.}"

          # Match the official release job's versionCode arithmetic. Build one integer
          # above the highest published tag, so a preview upgrades the latest release
          # and the next ordinary beta/stable keeps its reserved numbering scheme.
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v${SERIES_PATTERN}\.([0-9]+)$ ]]; then
              patch=$((10#${BASH_REMATCH[1]}))
              channel=999
            elif [[ "$tag" =~ ^v${SERIES_PATTERN}\.([0-9]+)-beta-([0-9]+)$ ]]; then
              patch=$((10#${BASH_REMATCH[1]}))
              channel=$((10#${BASH_REMATCH[2]}))
            else
              continue
            fi
            code=$((BASE_CODE + patch * 1000 + channel))
            (( code > MAX_CODE )) && MAX_CODE=$code
            (( patch > MAX_PATCH )) && MAX_PATCH=$patch
          done < <(git tag --list "v${RELEASE_SERIES}.*")

          VERSION_CODE=$((MAX_CODE + 1))
          (( VERSION_CODE <= 2100000000 )) || {
            echo "::error::Preview versionCode exceeds Android's supported range."
            exit 1
          }
          # Both in-app release comparators strip SemVer build metadata at '+'. A
          # prerelease '-pr...' suffix instead parses as version zero and causes
          # false update/downgrade prompts on signed PR preview installations.
          VERSION_NAME="${RELEASE_SERIES}.${MAX_PATCH}+pr${PR_NUMBER}.${SHORT_SHA}"
          {
            echo "code=$VERSION_CODE"
            echo "name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Preview metadata"
            echo "- Android versionName: \`${VERSION_NAME}\`"
            echo "- Android versionCode: \`${VERSION_CODE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode and inspect the official signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Missing required signing secret: $name"
              exit 1
            }
          done

          KEYSTORE_PATH="$RUNNER_TEMP/waenhancer-community-pr-preview.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$CERT_SHA256" ]] || {
            echo "::error::Could not read signing certificate fingerprint."
            exit 1
          }
          {
            echo "keystore_path=$KEYSTORE_PATH"
            echo "cert_sha256=$CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Test and build signed release-variant APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean \
            :app:testWhatsappDebugUnitTest \
            :app:assembleWhatsappRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PandroidStoreFile="$KEYSTORE_PATH" \
            -PandroidStorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"

      - name: Verify identity, signing certificate, profile and version
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk')
          [[ "${#apks[@]}" == 1 ]] || {
            echo "::error::Exactly one release APK must be produced."
            exit 1
          }
          SOURCE_APK="${apks[0]}"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort | tail -n 1)"
          python3 tools/verify_apk_profile.py "$SOURCE_APK" AppOnly \
            --aapt2 "$BT/aapt2" --apkanalyzer "$ANALYZER"

          REPORT="$("$BT/apksigner" verify --verbose --print-certs "$SOURCE_APK")"
          if grep -qi 'CN=Android Debug' <<< "$REPORT"; then
            echo "::error::Preview was signed with the debug certificate."
            exit 1
          fi
          ACTUAL_CERT="$(awk '/^(Signer #[0-9]+ |V[0-9.]+ Signer: )certificate SHA-256 digest:/{print $NF; exit}' <<< "$REPORT" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$ACTUAL_CERT" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::Preview certificate differs from the official release keystore."
            exit 1
          }

          BADGING="$("$BT/aapt" dump badging "$SOURCE_APK" | head -n 1)"
          ACTUAL_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          [[ "$ACTUAL_ID" == "com.waenhancer.community" && \
             "$ACTUAL_CODE" == "$EXPECTED_VERSION_CODE" && \
             "$ACTUAL_NAME" == "$EXPECTED_VERSION_NAME" ]] || {
            echo "::error::APK package or version metadata does not match the selected PR."
            exit 1
          }

          mkdir -p preview
          OUTPUT="preview/WaEnhancerCommunity-PR${PR_NUMBER}-${SHORT_SHA}-signed.apk"
          cp "$SOURCE_APK" "$OUTPUT"
          (cd preview && sha256sum "$(basename "$OUTPUT")" > "$(basename "$OUTPUT").sha256")
          {
            echo "PR=${PR_NUMBER}"
            echo "SHA=${EXPECTED_SHA}"
            echo "VERSION_NAME=${EXPECTED_VERSION_NAME}"
            echo "VERSION_CODE=${EXPECTED_VERSION_CODE}"
            echo "SIGNER_SHA256=${ACTUAL_CERT}"
          } > preview/build-info.txt
          {
            echo "### Signed APK"
            echo "- APK: \`$(basename "$OUTPUT")\`"
            echo "- Application ID: \`${ACTUAL_ID}\`"
            echo "- Signing cert SHA-256: \`${ACTUAL_CERT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaEnhancerCommunity-PR${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.short_sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            rm -f "$KEYSTORE_PATH"
          fi
