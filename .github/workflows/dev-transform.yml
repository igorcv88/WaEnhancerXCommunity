name: Temporary source transformation

on:
  pull_request:
    branches:
      - integration/community

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply requested source transformation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f .github/run-next-transform || ! -f tools/next_transform.py ]]; then
            echo "No transformation request; skipping."
            exit 0
          fi
          python3 tools/next_transform.py
          rm -f .github/run-next-transform tools/next_transform.py
          git config user.name "ChatGPT Blocks A-B"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve floating bar defaults and scroll modes"
          git push origin "HEAD:${HEAD_REF}"
