name: Publish signed release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: waenhancer-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SERIES: "0.0"

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release comes from master
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Run the release workflow from the master branch."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve next version automatically
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          BASE_VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' gradle.properties | tr -d '\r' | tail -n 1)"
          [[ "$BASE_VERSION_CODE" =~ ^[0-9]+$ ]] || {
            echo "VERSION_CODE in gradle.properties must be numeric" >&2
            exit 1
          }

          LATEST_TAG="$(
            git tag --list "v${RELEASE_SERIES}.*" --sort=-v:refname \
              | grep -E "^v${RELEASE_SERIES//./\.}\.[0-9]+$" \
              | head -n 1 \
              || true
          )"

          if [[ -z "$LATEST_TAG" ]]; then
            PATCH=1
          else
            PATCH="${LATEST_TAG##*.}"
            PATCH=$((10#$PATCH + 1))
          fi

          VERSION_NAME="${RELEASE_SERIES}.${PATCH}"
          VERSION_CODE=$((10#$BASE_VERSION_CODE + PATCH))
          TAG_NAME="v${VERSION_NAME}"

          case "$CHANNEL" in
            beta)
              RELEASE_TITLE="WaEnhancer Community ${VERSION_NAME} Beta"
              PRERELEASE=true
              ;;
            stable)
              RELEASE_TITLE="WaEnhancer Community ${VERSION_NAME}"
              PRERELEASE=false
              ;;
            *)
              echo "Unsupported release channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Generated tag already exists: ${TAG_NAME}" >&2
            exit 1
          fi

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag_name=$TAG_NAME"
            echo "release_title=$RELEASE_TITLE"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release metadata"
            echo "- Version: \`${VERSION_NAME}\`"
            echo "- Android versionCode: \`${VERSION_CODE}\`"
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Tag: \`${TAG_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode and inspect signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret ${name} is missing" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/waenhancer-community-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          EXPECTED_CERT_SHA256="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED_CERT_SHA256" || {
            echo "Could not read signing certificate SHA-256" >&2
            exit 1
          }

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "expected_cert_sha256=$EXPECTED_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleWhatsappRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PandroidStoreFile="$KEYSTORE_PATH" \
            -PandroidStorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"

      - name: Locate and name release APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          SOURCE_APK="$(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$SOURCE_APK" || {
            echo "Release APK was not produced" >&2
            exit 1
          }

          mkdir -p release
          APK_PATH="release/WaEnhancerCommunity-v${VERSION_NAME}.apk"
          cp "$SOURCE_APK" "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify signature, identity, version, and checksum
        id: verify
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.expected_cert_sha256 }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          EXPECTED_APPLICATION_ID: com.waenhancer.community
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          test -x "$APKSIGNER" || { echo "apksigner not found" >&2; exit 1; }
          test -x "$AAPT" || { echo "aapt not found" >&2; exit 1; }

          SIGNATURE_REPORT="$($APKSIGNER verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNATURE_REPORT"

          if grep -qi 'CN=Android Debug' <<< "$SIGNATURE_REPORT"; then
            echo "APK is signed with an Android debug certificate" >&2
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(awk '/^(Signer #[0-9]+ |V[0-9.]+ Signer: )certificate SHA-256 digest:/{print $NF; exit}' <<< "$SIGNATURE_REPORT" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          [[ "$ACTUAL_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "APK certificate does not match the configured keystore" >&2
            exit 1
          }

          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          ACTUAL_APPLICATION_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"

          [[ "$ACTUAL_APPLICATION_ID" == "$EXPECTED_APPLICATION_ID" ]] || {
            echo "Unexpected application ID: $ACTUAL_APPLICATION_ID" >&2
            exit 1
          }
          [[ "$ACTUAL_VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]] || {
            echo "Unexpected versionCode: $ACTUAL_VERSION_CODE" >&2
            exit 1
          }
          [[ "$ACTUAL_VERSION_NAME" == "$EXPECTED_VERSION_NAME" ]] || {
            echo "Unexpected versionName: $ACTUAL_VERSION_NAME" >&2
            exit 1
          }

          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          CHECKSUM_PATH="${APK_PATH}.sha256"
          printf '%s  %s\n' "$SHA256" "$(basename "$APK_PATH")" > "$CHECKSUM_PATH"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

          {
            echo "### Verification"
            echo "- APK SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          CHECKSUM_PATH: ${{ steps.verify.outputs.checksum_path }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail

          ARGS=(
            release create "$TAG_NAME"
            "$APK_PATH"
            "$CHECKSUM_PATH"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh "${ARGS[@]}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            rm -f "$KEYSTORE_PATH"
          fi
