name: Manual signed release.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional; must match VERSION_NAME in gradle.properties"
        required: false
        type: string
      version_code:
        description: "Optional; must match VERSION_CODE in gradle.properties"
        required: false
        type: string
      tag_name:
        description: "Release tag; defaults to v<VERSION_NAME>"
        required: false
        type: string
      release_title:
        description: "Release title; defaults to WaEnhancer Community <VERSION_NAME>"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Optional release notes; SHA-256 is appended automatically"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve and validate release metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail

          FILE_VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '\r' | tail -n 1)"
          FILE_VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' gradle.properties | tr -d '\r' | tail -n 1)"

          test -n "$FILE_VERSION_NAME" || { echo "VERSION_NAME is missing" >&2; exit 1; }
          test -n "$FILE_VERSION_CODE" || { echo "VERSION_CODE is missing" >&2; exit 1; }
          [[ "$FILE_VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "VERSION_CODE must be numeric" >&2; exit 1; }

          if [[ -n "$INPUT_VERSION_NAME" && "$INPUT_VERSION_NAME" != "$FILE_VERSION_NAME" ]]; then
            echo "Input version_name ($INPUT_VERSION_NAME) does not match gradle.properties ($FILE_VERSION_NAME)" >&2
            exit 1
          fi

          if [[ -n "$INPUT_VERSION_CODE" && "$INPUT_VERSION_CODE" != "$FILE_VERSION_CODE" ]]; then
            echo "Input version_code ($INPUT_VERSION_CODE) does not match gradle.properties ($FILE_VERSION_CODE)" >&2
            exit 1
          fi

          TAG_NAME="${INPUT_TAG_NAME:-v${FILE_VERSION_NAME}}"
          RELEASE_TITLE="${INPUT_RELEASE_TITLE:-WaEnhancer Community ${FILE_VERSION_NAME}}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists" >&2
            exit 1
          fi

          {
            echo "version_name=$FILE_VERSION_NAME"
            echo "version_code=$FILE_VERSION_CODE"
            echo "tag_name=$TAG_NAME"
            echo "release_title=$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Decode and inspect signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required secret ${name} is missing" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/waenhancer-community-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          EXPECTED_CERT_SHA256="$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED_CERT_SHA256" || { echo "Could not read signing certificate SHA-256" >&2; exit 1; }

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "expected_cert_sha256=$EXPECTED_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleWhatsappRelease \
            -Pminify=true \
            -PandroidStoreFile="$KEYSTORE_PATH" \
            -PandroidStorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"

      - name: Locate and name release APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail
          SOURCE_APK="$(find app/build/outputs/apk/whatsapp/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$SOURCE_APK" || { echo "Release APK was not produced" >&2; exit 1; }

          mkdir -p release
          APK_PATH="release/WaEnhancerCommunity-v${VERSION_NAME}.apk"
          cp "$SOURCE_APK" "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify signature, identity, version, and checksum
        id: verify
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          EXPECTED_CERT_SHA256: ${{ steps.signing.outputs.expected_cert_sha256 }}
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          EXPECTED_APPLICATION_ID: com.waenhancer.community
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"

          test -x "$APKSIGNER" || { echo "apksigner not found" >&2; exit 1; }
          test -x "$AAPT" || { echo "aapt not found" >&2; exit 1; }

          SIGNATURE_REPORT="$($APKSIGNER verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$SIGNATURE_REPORT"

          if grep -qi 'CN=Android Debug' <<< "$SIGNATURE_REPORT"; then
            echo "APK is signed with an Android debug certificate" >&2
            exit 1
          fi

          ACTUAL_CERT_SHA256="$(awk '/^(Signer #[0-9]+ |V[0-9.]+ Signer: )certificate SHA-256 digest:/{print $NF; exit}' <<< "$SIGNATURE_REPORT" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          [[ "$ACTUAL_CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "APK certificate does not match the configured keystore" >&2
            exit 1
          }

          BADGING="$($AAPT dump badging "$APK_PATH" | head -n 1)"
          ACTUAL_APPLICATION_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"

          [[ "$ACTUAL_APPLICATION_ID" == "$EXPECTED_APPLICATION_ID" ]] || {
            echo "Unexpected application ID: $ACTUAL_APPLICATION_ID" >&2
            exit 1
          }
          [[ "$ACTUAL_VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]] || {
            echo "Unexpected versionCode: $ACTUAL_VERSION_CODE" >&2
            exit 1
          }
          [[ "$ACTUAL_VERSION_NAME" == "$EXPECTED_VERSION_NAME" ]] || {
            echo "Unexpected versionName: $ACTUAL_VERSION_NAME" >&2
            exit 1
          }

          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and attach APK directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s\n\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          else
            printf 'Manual signed release from commit `%s`.\n\n' "$GITHUB_SHA" > "$NOTES_FILE"
          fi
          printf 'SHA-256: `%s`\n' "$SHA256" >> "$NOTES_FILE"

          ARGS=(release create "$TAG_NAME" "$APK_PATH" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" ]]; then
            rm -f "$KEYSTORE_PATH"
          fi
