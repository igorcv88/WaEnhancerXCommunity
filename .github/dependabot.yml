version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep Gradle/Maven updates isolated. Toolchain majors (AGP, Gradle, Kotlin)
    # and Android runtime libraries have different compatibility constraints, and
    # grouping everything into one PR makes one incompatible upgrade block every
    # unrelated patch update.
