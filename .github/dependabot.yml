version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep Gradle/Maven updates isolated. Toolchain majors (AGP, Gradle, Kotlin)
    # and Android runtime libraries have different compatibility constraints, and
    # grouping everything into one PR makes one incompatible upgrade block every
    # unrelated patch update.
    ignore:
      # OkHttp 5.5.0+ publishes okhttp-android with compileSdk 37 metadata.
      # This app intentionally stays on AGP 8.13.x / compileSdk 36 while the
      # materialthemebuilder plugin is not yet safe to migrate to AGP 9.
      - dependency-name: "com.squareup.okhttp3:okhttp"
        versions:
          - ">=5.5.0"
