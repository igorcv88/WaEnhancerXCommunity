<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">WaEnhancer Community</title>
  <desc id="desc">Open-source LSPosed module for WhatsApp — privacy, customization, media and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031012"/>
      <stop offset="0.55" stop-color="#06191a"/>
      <stop offset="1" stop-color="#08211c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f5bd"/>
      <stop offset="0.5" stop-color="#24d98b"/>
      <stop offset="1" stop-color="#0c8f61"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#24d98b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#24d98b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="34" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="464" rx="28" fill="none" stroke="#1cbf7a" stroke-opacity=".55" stroke-width="2"/>

  <circle cx="280" cy="250" r="225" fill="url(#glow)"/>
  <circle cx="1330" cy="60" r="205" fill="none" stroke="#1cbf7a" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1330" cy="60" r="145" fill="none" stroke="#1cbf7a" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1330" cy="60" r="90" fill="none" stroke="#1cbf7a" stroke-opacity=".08" stroke-width="2"/>

  <path d="M540 388 C760 170 1010 155 1610 255" fill="none" stroke="#1cbf7a" stroke-opacity=".18" stroke-width="2"/>
  <path d="M560 405 C805 192 1050 180 1610 282" fill="none" stroke="#1cbf7a" stroke-opacity=".12" stroke-width="2"/>
  <path d="M585 420 C850 215 1090 207 1610 310" fill="none" stroke="#1cbf7a" stroke-opacity=".08" stroke-width="2"/>

  <g transform="translate(92 108)">
    <path d="M20 40 L82 40 L130 142 L177 67 L224 142 L271 40 L333 40 L250 218 L205 218 L177 169 L149 218 L104 218 Z"
          fill="url(#brand)"/>
    <path d="M177 67 L224 142 L205 178 L177 129 L149 178 L130 142 Z" fill="#071517" fill-opacity=".88"/>
    <path d="M288 24 L299 49 L325 60 L299 71 L288 96 L277 71 L251 60 L277 49 Z" fill="#f2fff9"/>
  </g>

  <text x="535" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" letter-spacing="-2">
    <tspan fill="#f7faf9" font-size="68">WaEnhancer</tspan>
    <tspan dx="18" fill="#32e49a" font-size="42" letter-spacing="0">Community</tspan>
  </text>
  <text x="540" y="238" fill="#bdd0ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="400">
    Open-source LSPosed module for WhatsApp
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">
    <rect x="540" y="282" width="150" height="50" rx="25" fill="#12392d" stroke="#28da91" stroke-opacity=".45"/>
    <text x="615" y="314" text-anchor="middle" fill="#caffea">Privacy</text>

    <rect x="708" y="282" width="205" height="50" rx="25" fill="#12392d" stroke="#28da91" stroke-opacity=".45"/>
    <text x="810.5" y="314" text-anchor="middle" fill="#caffea">Customization</text>

    <rect x="931" y="282" width="145" height="50" rx="25" fill="#12392d" stroke="#28da91" stroke-opacity=".45"/>
    <text x="1003.5" y="314" text-anchor="middle" fill="#caffea">Media</text>

    <rect x="1094" y="282" width="190" height="50" rx="25" fill="#12392d" stroke="#28da91" stroke-opacity=".45"/>
    <text x="1189" y="314" text-anchor="middle" fill="#caffea">Automation</text>
  </g>

  <g transform="translate(540 365)">
    <rect width="152" height="48" rx="24" fill="#15513e" stroke="#37efaa" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="7" fill="#4ff0ad"/>
    <text x="91" y="31" text-anchor="middle" fill="#e3fff1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">BETA</text>
  </g>

  <text x="724" y="398" fill="#8eaaa1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">
    Android 9+ · WhatsApp &amp; WhatsApp Business
  </text>
</svg>
